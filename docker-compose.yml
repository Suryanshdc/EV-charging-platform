version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-charging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evcharge
      POSTGRES_PASSWORD: evcharge
      POSTGRES_DB: evcharge
    ports:
      - '5432:5432'
    volumes:
      - ev_charging_pgdata:/var/lib/postgresql/data

volumes:
  ev_charging_pgdata:
